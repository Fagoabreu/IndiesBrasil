services:
  database:
    container_name: "postgres-dev"
    image: "postgres:17.2-alpine3.20"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
  mailcatcher:
    container_name: "mailcatcher-dev"
    image: "sj26/mailcatcher"
    ports:
      - "1025:1025"
      - "1080:1080"
  livekit:
    # SFU de reuniões por vídeo (dev). A imagem livekit/livekit-server tem
    # ENTRYPOINT [/livekit-server], então o `command` do Compose viraria
    # argumento do binário (erro "flag -c not defined"). Sobrescrevemos o
    # entrypoint para o shell gerar a config a partir do .env.development
    # ($$ escapa da interpolação do Compose e é expandida pelo shell dentro
    # do container). O binário fica em /livekit-server (fora do PATH).
    container_name: "livekit-dev"
    image: "livekit/livekit-server"
    env_file:
      - ../.env.development
    ports:
      - "7880:7880" # WebSocket (browser conecta aqui)
      - "7881:7881" # Transporte TCP de mídia
    entrypoint:
      - "/bin/sh"
      - "-c"
    command:
      - |
        cat > /etc/livekit.yaml <<EOF
        port: 7880
        rtc:
          tcp_port: 7881
          use_external_ip: false
          port_range_start: 50000
          port_range_end: 60000
        keys:
          $${LIVEKIT_API_KEY}: "$${LIVEKIT_API_SECRET}"
        room:
          empty_timeout: 600
          max_participants: 50
        EOF
        exec /livekit-server --config /etc/livekit.yaml
