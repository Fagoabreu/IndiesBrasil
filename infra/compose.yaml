services:
  database:
    container_name: "postgres-dev"
    image: "postgres:17.2-alpine3.20"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
  mailcatcher:
    container_name: "mailcatcher-dev"
    image: "sj26/mailcatcher"
    # Portas do host fora da faixa comum: a 1025 (SMTP, "quick" no IANA) é
    # disputada no Windows — o Rockstar Games Launcher (`RLHostService`) a ocupa
    # em `127.0.0.1` e **aceita a conexão sem responder SMTP**, o que aparece
    # como "Greeting never received" no nodemailer e como e-mail que nunca chega.
    # Como o Mailcatcher saudável continua na 1025 **dentro** do container
    # (imagem fixa), só o lado do host muda: o container fica intocado.
    #
    # Quem depende destes números no host: `EMAIL_SMTP_PORT`/`EMAIL_HTTP_PORT`
    # em `.env.development` (app e suíte de testes). Ao mudar aqui, mude lá.
    ports:
      - "4025:1025"
      - "4080:1080"
  # Webconferência (Galene 1.2.1). Mesma imagem do deploy (`galene/`),
  # compilada localmente na primeira subida com `services:up`. O app (npm run
  # dev, no host) usa MEET_URL padrão ws://localhost:8000 e grava os grupos em
  # galene/groups — por isso o bind-mount abaixo: o Galene faz hot-reload do
  # arquivo e o JWT emitido é validado na hora. Detalhes do subprojeto
  # (versão base, customizações, rebase): galene/README.md e galene/UPSTREAM.md.
  #
  # Diferenças propositais para dev:
  #  - portas publicadas (8000) em vez de network_mode: host — Docker Desktop
  #    (Windows/macOS) não suporta host networking;
  #  - TURN desligado (`-turn ""`) — sem rede restrita no dev local o TURN só
  #    causaria erro de "no public addresses" dentro do container.
  galene:
    container_name: "galene-dev"
    image: "indies-galene:galene-1.2.1"
    build:
      context: ../galene
    command:
      - "-http"
      - ":8000"
      - "-insecure"
      - "-turn"
      - ""
      - "-groups"
      - "/app/groups"
      - "-data"
      - "/app/data"
    ports:
      - "8000:8000"
    volumes:
      # Mesmo diretório usado pelo lib/galene.js em dev (GALENE_GROUPS_DIR
      # padrão): galene/groups, relativo à raiz do repo.
      - ../galene/groups:/app/groups
