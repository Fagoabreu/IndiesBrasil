name: Deploy Infra (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm infra deployment"
        required: true

jobs:
  deploy-infra:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy files
        run: |
          mkdir -p /var/www/indies/nginx
          cp "$GITHUB_WORKSPACE/deploy/nginx/"* /var/www/indies/nginx/
          # Infra roda com o compose.yaml do repositório — não depender de um
          # push do app para atualizar a definição do livekit/nginx/postgres.
          cp "$GITHUB_WORKSPACE/deploy/compose.yaml" /var/www/indies/
          echo "📋 Nginx config files copied:"
          ls -la /var/www/indies/nginx/

      - name: Apply infra
        run: |
          set -e

          cd /var/www/indies

          echo "🔍 Checking .env.production"
          test -f .env.production || {
            echo "❌ .env.production NOT FOUND"
            exit 1
          }

          CERTBOT_DOMAIN=$(sed -n 's/^CERTBOT_DOMAIN=//p' .env.production)
          CERTBOT_EMAIL=$(sed -n 's/^CERTBOT_EMAIL=//p' .env.production)

          if [ -z "$CERTBOT_DOMAIN" ]; then
            echo "❌ CERTBOT_DOMAIN is empty in .env.production"
            exit 1
          fi

          if [ -z "$CERTBOT_EMAIL" ]; then
            echo "❌ CERTBOT_EMAIL is empty in .env.production"
            exit 1
          fi

          CERTBOT_DOMAINS_CSV=$(echo "$CERTBOT_DOMAIN" | tr -d '[:space:]')
          PRIMARY_DOMAIN="${CERTBOT_DOMAINS_CSV%%,*}"

          if [ -z "$PRIMARY_DOMAIN" ]; then
            echo "❌ Invalid CERTBOT_DOMAIN value: '$CERTBOT_DOMAIN'"
            exit 1
          fi

          docker volume inspect indies_postgres-certs >/dev/null 2>&1 || docker volume create indies_postgres-certs
          docker run --rm -e HOME -e PATH -v indies_postgres-certs:/certs alpine:latest sh -c '
            apk add --no-cache openssl >/dev/null 2>&1

            if [ ! -f /certs/root.key ]; then
              echo "🧾 Generating root CA"
              openssl genrsa -out /certs/root.key 4096
              openssl req -x509 -new -nodes \
                -key /certs/root.key \
                -sha256 -days 3650 \
                -subj "/CN=Postgres Root CA" \
                -out /certs/root.crt
            fi

            if [ ! -f /certs/server.key ]; then
              echo "🔑 Generating server key"
              openssl genrsa -out /certs/server.key 4096
            fi

            if [ ! -f /certs/server.csr ]; then
              echo "📄 Generating server CSR"
              openssl req -new \
                -key /certs/server.key \
                -subj "/CN=postgres" \
                -out /certs/server.csr
            fi

            if [ ! -f /certs/server.crt ]; then
              echo "📜 Signing server certificate"
              openssl x509 -req \
                -in /certs/server.csr \
                -CA /certs/root.crt \
                -CAkey /certs/root.key \
                -CAcreateserial \
                -out /certs/server.crt \
                -days 3650 -sha256
            fi

            echo "🔒 Fixing permissions"
            chown -R 70:70 /certs
            chmod 755 /certs
            chmod 600 /certs/server.key
            chmod 644 /certs/server.crt /certs/root.crt

            echo "✅ Postgres SSL certificates ready"
          '

          echo "🧩 Creating temporary self-signed certificate for nginx bootstrap (if needed)"
          docker run --rm \
            -e DOMAIN="$PRIMARY_DOMAIN" \
            -v indies_nginx_secrets:/secrets \
            alpine:latest sh -c '
              mkdir -p /secrets/live/$DOMAIN
              if [ ! -f /secrets/live/$DOMAIN/fullchain.pem ] || [ ! -f /secrets/live/$DOMAIN/privkey.pem ]; then
                apk add --no-cache openssl >/dev/null 2>&1
                openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                  -keyout /secrets/live/$DOMAIN/privkey.pem \
                  -out /secrets/live/$DOMAIN/fullchain.pem \
                  -subj "/CN=$DOMAIN"
              fi
            '

          # ── LIVEKIT precisa existir ANTES do up ──
          # Sem as chaves o heredoc do serviço livekit gera YAML inválido
          # ("keys:\n  : \"\"") e o container morre na largada com erro opaco.
          # As vars só chegam ao servidor via deploy.yml (push), que escreve
          # .env.production a partir de vars/secrets do GitHub.
          LIVEKIT_KEY=$(sed -n 's/^LIVEKIT_API_KEY=//p' .env.production)
          LIVEKIT_SECRET=$(sed -n 's/^LIVEKIT_API_SECRET=//p' .env.production)
          if [ -z "$LIVEKIT_KEY" ] || [ -z "$LIVEKIT_SECRET" ]; then
            echo "❌ LIVEKIT_API_KEY / LIVEKIT_API_SECRET ausentes no .env.production"
            echo "   As linhas do deploy.yml estão vazias porque as secrets ainda"
            echo "   não existem no GitHub (Settings → Environments → production)."
            echo "   Adicione as secrets e rode o deploy.yml (push) para gerar o .env."
            exit 1
          fi
          if [ "${#LIVEKIT_KEY}" -lt 32 ] || [ "${#LIVEKIT_SECRET}" -lt 32 ]; then
            echo "❌ LIVEKIT_API_KEY / LIVEKIT_API_SECRET precisam de >= 32 caracteres"
            exit 1
          fi

          # nginx/postgres sobem primeiro; o livekit é iniciado por último, após
          # o TLS ser renovado — um problema no SFU não deve bloquear cert/nginx.
          echo "🚀 Deploying infra (postgres + nginx)"
          docker compose pull postgres nginx certbot livekit
          docker compose up -d postgres nginx

          echo "📜 Requesting or renewing public TLS certificate"
          echo "ℹ️ Certbot cert-name: $PRIMARY_DOMAIN"
          echo "ℹ️ Certbot domains: $CERTBOT_DOMAINS_CSV"
          docker compose run --rm certbot certonly \
            --webroot \
            --webroot-path=/var/www/certbot \
            --non-interactive \
            --agree-tos \
            --no-eff-email \
            --keep-until-expiring \
            --expand \
            --renew-with-new-domains \
            --cert-name "$PRIMARY_DOMAIN" \
            --email "$CERTBOT_EMAIL" \
            -d "$CERTBOT_DOMAINS_CSV"

          NGINX_CERT="/etc/letsencrypt/live/$PRIMARY_DOMAIN/fullchain.pem"
          docker exec nginx test -f "$NGINX_CERT" || {
            echo "❌ fullchain.pem not found in nginx at $NGINX_CERT"
            exit 1
          }

          docker exec nginx openssl x509 -in "$NGINX_CERT" -noout -subject -issuer -dates -ext subjectAltName

          echo "🔄 Reloading nginx with the latest certificates"
          docker exec nginx nginx -s reload

          # ── livekit por último ──
          # Com network_mode: host (deploy/compose.yaml) o bind é direto nas
          # portas do host — sem docker-proxy/bridge e sem risco de `up` travar
          # publicando as 10001 portas UDP. Mesmo assim, remove o container
          # anterior de forma INcondicional: um crash loop (restart: always)
          # aparece no `docker ps` e a remoção condicional antiga era pulada.
          echo "🚀 Starting livekit"
          docker compose rm -sf livekit 2>&1 || true
          docker compose up -d livekit

          # Config inválida derruba o livekit em segundos; espera bounded e
          # detecta crash loop via RestartCount antes de declarar sucesso.
          echo "🔎 Aguardando livekit ficar running..."
          LIVEKIT_OK=0
          for i in $(seq 1 20); do
            STATE=$(docker inspect -f '{{.State.Status}}' livekit 2>/dev/null || echo absent)
            if [ "$STATE" = "running" ]; then
              LIVEKIT_OK=1
              break
            fi
            sleep 1
          done

          # Janela para um crash por config inválida aparecer no RestartCount.
          sleep 3
          docker compose ps livekit --format "{{.Name}} {{.State}} {{.Status}}"

          STATE=$(docker inspect -f '{{.State.Status}}' livekit 2>/dev/null || echo absent)
          RESTARTS=$(docker inspect -f '{{.RestartCount}}' livekit 2>/dev/null || echo 99)
          if [ "$LIVEKIT_OK" = "1" ] && [ "$STATE" = "running" ] && [ "$RESTARTS" -lt 2 ]; then
            echo "✅ livekit rodando (state=$STATE restarts=$RESTARTS)"
          else
            echo "❌ livekit não estabilizou (state=$STATE restarts=$RESTARTS). Últimos logs:"
            docker logs --tail 50 livekit 2>&1 || true
            exit 1
          fi
