name: Deploy Indies Brasil

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── .env.production ──
      - name: Generate .env.production
        run: |
          set -e

          if [ -z "${{ vars.CERTBOT_DOMAIN }}" ]; then
            echo "::error::CERTBOT_DOMAIN is not set in repository variables"
            exit 1
          fi
          if [ -z "${{ vars.CERTBOT_EMAIL }}" ]; then
            echo "::error::CERTBOT_EMAIL is not set in repository variables"
            exit 1
          fi

          mkdir -p /var/www/indies
          {
            echo "# Gerado pelo GitHub Actions em $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "NODE_ENV=production"
            echo "CERTBOT_ENV=production"
            echo "CERTBOT_DOMAIN=${{ vars.CERTBOT_DOMAIN }}"
            echo "CERTBOT_EMAIL=${{ vars.CERTBOT_EMAIL }}"
            echo "NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME }}"
            echo "NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}"
            echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}"
            echo "PEPPER=${{ secrets.PEPPER }}"
            echo "POSTGRES_HOST=${{ vars.POSTGRES_HOST }}"
            echo "POSTGRES_PORT=${{ vars.POSTGRES_PORT }}"
            echo "POSTGRES_DB=${{ vars.POSTGRES_DB }}"
            echo "POSTGRES_USER=${{ vars.POSTGRES_USER }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "POSTGRES_CA_PATH=${{ vars.POSTGRES_CA_PATH }}"
            echo "EMAIL_SMTP_HOST=${{ vars.EMAIL_SMTP_HOST }}"
            echo "EMAIL_SMTP_PORT=${{ vars.EMAIL_SMTP_PORT }}"
            echo "EMAIL_SMTP_USER=${{ vars.EMAIL_SMTP_USER }}"
            echo "EMAIL_SMTP_PASSWORD=${{ secrets.EMAIL_SMTP_PASSWORD }}"
            echo "CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}"
            echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
            echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
            echo "FILE_UPLOAD_BASE_FOLDER=${{ vars.FILE_UPLOAD_BASE_FOLDER }}"
            echo "TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}"
            echo "TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}"
            echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}"
            echo "LIVEKIT_URL=${{ vars.LIVEKIT_URL }}"
            echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}"
            echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}"
          } > /var/www/indies/.env.production

      # ── Arquivos de deploy ──
      - name: Prepare deploy directory
        run: |
          mkdir -p /var/www/indies/nginx /var/www/indies/certs
          cp "$GITHUB_WORKSPACE/deploy/nginx/"* /var/www/indies/nginx/
          cp "$GITHUB_WORKSPACE/deploy/compose.yaml" /var/www/indies/

      # ── Certificados SSL do Postgres ──
      # Usa um container temporário para escrever no volume Docker.
      # O github-runner não tem acesso a /var/lib/docker/volumes/ no host,
      # mas o container roda como root e escreve via bind mount.
      - name: Ensure Postgres SSL certificates
        run: |
          docker volume inspect indies_postgres-certs >/dev/null 2>&1 || docker volume create indies_postgres-certs
          docker run --rm -e HOME -e PATH -v indies_postgres-certs:/certs alpine:latest sh -c '
            apk add --no-cache openssl >/dev/null 2>&1

            if [ ! -f /certs/root.key ]; then
              echo "🧾 Generating root CA"
              openssl genrsa -out /certs/root.key 4096
              openssl req -x509 -new -nodes \
                -key /certs/root.key \
                -sha256 -days 3650 \
                -subj "/CN=Postgres Root CA" \
                -out /certs/root.crt
            fi

            if [ ! -f /certs/server.key ]; then
              echo "🔑 Generating server key"
              openssl genrsa -out /certs/server.key 4096
            fi

            if [ ! -f /certs/server.csr ]; then
              echo "📄 Generating server CSR"
              openssl req -new \
                -key /certs/server.key \
                -subj "/CN=postgres" \
                -out /certs/server.csr
            fi

            if [ ! -f /certs/server.crt ]; then
              echo "📜 Signing server certificate"
              openssl x509 -req \
                -in /certs/server.csr \
                -CA /certs/root.crt \
                -CAkey /certs/root.key \
                -CAcreateserial \
                -out /certs/server.crt \
                -days 3650 -sha256
            fi

            echo "🔒 Fixing permissions"
            chown -R 70:70 /certs
            chmod 755 /certs
            chmod 600 /certs/server.key
            chmod 644 /certs/server.crt /certs/root.crt

            echo "✅ Postgres SSL certificates ready"
          '

      # ── Build & deploy ──
      - name: Build app
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "🐳 Building Docker image..."
          docker build -t indies-app:latest .
          # O estágio `deps` mantém o node-pg-migrate instalado e é reutilizado
          # no passo de migrations, garantindo a mesma versão do package-lock.
          docker build --target deps -t indies-migrate:latest .

          cd /var/www/indies

          echo "🔍 Checking .env.production"
          test -f .env.production || { echo "❌ .env.production NOT FOUND"; exit 1; }

          echo "🔍 Checking nginx config files"
          test -f nginx/indies.http.conf || { echo "❌ indies.http.conf NOT FOUND"; exit 1; }
          test -f nginx/indies.https.conf || { echo "❌ indies.https.conf NOT FOUND"; exit 1; }

      # ── Migrations do banco ──
      # Aplica as migrations pendentes ANTES de subir a nova versão do app,
      # garantindo que o código novo nunca rode contra um schema desatualizado.
      - name: Run database migrations
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "⏳ Waiting for Postgres..."
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U "${{ vars.POSTGRES_USER }}" -d "${{ vars.POSTGRES_DB }}" >/dev/null 2>&1; then
              echo "✅ Postgres is ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "❌ Postgres did not become ready in time"
              exit 1
            fi
            sleep 2
          done

          echo "🛠️ Running pending database migrations..."
          docker run --rm \
            --network indies_private \
            -e DATABASE_URL="postgres://${{ vars.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ vars.POSTGRES_HOST }}:${{ vars.POSTGRES_PORT }}/${{ vars.POSTGRES_DB }}?sslmode=no-verify" \
            indies-migrate:latest \
            npx node-pg-migrate -m infra/migrations up

      # ── Start app ──
      # Livekit, nginx, postgres e certbot são infra e são gerenciados
      # exclusivamente pelo workflow manual deploy-infra.yml. Recriar o SFU a
      # cada push acopla o deploy do app à saúde da infra — aqui recriamos
      # apenas o app.
      - name: Start app
        run: |
          cd /var/www/indies
          echo "🚀 Starting app..."
          docker compose -f compose.yaml up -d --no-deps --force-recreate indies-app

      # ── Certificado bootstrap do nginx ──
      # O deploy copia deploy/nginx/* (inclui livekit.conf), que referencia
      # /etc/letsencrypt/live/<domínio-primário>. Se o certificado ainda não
      # existir (antes do primeiro deploy-infra), o reload falharia. Garante
      # um self-signed; o workflow manual deploy-infra troca pelo real.
      - name: Ensure nginx bootstrap certificate
        run: |
          set -e
          cd /var/www/indies
          CERTBOT_DOMAIN=$(sed -n 's/^CERTBOT_DOMAIN=//p' .env.production)
          [ -n "$CERTBOT_DOMAIN" ] || { echo "❌ CERTBOT_DOMAIN empty in .env.production"; exit 1; }
          PRIMARY_DOMAIN="${CERTBOT_DOMAIN%%,*}"
          docker volume inspect indies_nginx_secrets >/dev/null 2>&1 || docker volume create indies_nginx_secrets
          docker run --rm \
            -e DOMAIN="$PRIMARY_DOMAIN" \
            -v indies_nginx_secrets:/secrets \
            alpine:latest sh -c '
              mkdir -p /secrets/live/$DOMAIN
              if [ ! -f /secrets/live/$DOMAIN/fullchain.pem ] || [ ! -f /secrets/live/$DOMAIN/privkey.pem ]; then
                apk add --no-cache openssl >/dev/null 2>&1
                openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                  -keyout /secrets/live/$DOMAIN/privkey.pem \
                  -out /secrets/live/$DOMAIN/fullchain.pem \
                  -subj "/CN=$DOMAIN"
              fi
            '
          echo "✅ nginx bootstrap certificate ensured for $PRIMARY_DOMAIN"

      # ── Reload nginx ──
      - name: Reload nginx
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^nginx$'; then
            echo "⏳ Waiting for nginx to be running..."

            for i in $(seq 1 15); do
              STATUS=$(docker inspect -f '{{.State.Status}}' nginx 2>/dev/null || true)

              if [ "$STATUS" = "running" ]; then
                # livekit.conf referencia upstream host.docker.internal:7880
                # (livekit em network_mode: host — alcançado via extra_hosts
                # host-gateway do serviço nginx). host.docker.internal é estático
                # e sempre resolve; só falha se o container nginx ainda for de
                # antes do extra_hosts (o próximo deploy-infra o recria).
                echo "⏳ Waiting for upstream 'host.docker.internal' to resolve..."
                UPSTREAM_RESOLVES=0
                for j in $(seq 1 15); do
                  if docker exec nginx getent hosts host.docker.internal >/dev/null 2>&1; then
                    UPSTREAM_RESOLVES=1
                    echo "✅ upstream host.docker.internal resolvable"
                    break
                  fi
                  sleep 2
                done

                if [ "$UPSTREAM_RESOLVES" = "1" ]; then
                  docker exec nginx nginx -s reload
                  echo "✅ nginx reloaded"
                else
                  echo "⚠️ container nginx antigo sem extra_hosts (host.docker.internal não resolve)."
                  echo "   Reload adiado — rode o deploy-infra para recriar o nginx."
                fi
                exit 0
              fi

              echo "⏳ nginx status: $STATUS (retry $i/15)"
              sleep 2
            done

            echo "⚠️ nginx did not reach running state"
          else
            echo "ℹ️ nginx container not found, skipping reload"
          fi
