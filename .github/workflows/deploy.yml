name: Deploy Indies Brasil

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── .env.production ──
      - name: Generate .env.production
        run: |
          set -e

          if [ -z "${{ vars.CERTBOT_DOMAIN }}" ]; then
            echo "::error::CERTBOT_DOMAIN is not set in repository variables"
            exit 1
          fi
          if [ -z "${{ vars.CERTBOT_EMAIL }}" ]; then
            echo "::error::CERTBOT_EMAIL is not set in repository variables"
            exit 1
          fi

          mkdir -p /var/www/indies
          {
            echo "# Gerado pelo GitHub Actions em $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "NODE_ENV=production"
            echo "CERTBOT_ENV=production"
            echo "CERTBOT_DOMAIN=${{ vars.CERTBOT_DOMAIN }}"
            echo "CERTBOT_EMAIL=${{ vars.CERTBOT_EMAIL }}"
            echo "NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME }}"
            echo "NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}"
            echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}"
            echo "PEPPER=${{ secrets.PEPPER }}"
            echo "POSTGRES_HOST=${{ vars.POSTGRES_HOST }}"
            echo "POSTGRES_PORT=${{ vars.POSTGRES_PORT }}"
            echo "POSTGRES_DB=${{ vars.POSTGRES_DB }}"
            echo "POSTGRES_USER=${{ vars.POSTGRES_USER }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "POSTGRES_CA_PATH=${{ vars.POSTGRES_CA_PATH }}"
            echo "EMAIL_SMTP_HOST=${{ vars.EMAIL_SMTP_HOST }}"
            echo "EMAIL_SMTP_PORT=${{ vars.EMAIL_SMTP_PORT }}"
            echo "EMAIL_SMTP_USER=${{ vars.EMAIL_SMTP_USER }}"
            echo "EMAIL_SMTP_PASSWORD=${{ secrets.EMAIL_SMTP_PASSWORD }}"
            echo "CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}"
            echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
            echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
            echo "FILE_UPLOAD_BASE_FOLDER=${{ vars.FILE_UPLOAD_BASE_FOLDER }}"
            echo "TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}"
            echo "TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}"
            echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}"
          } > /var/www/indies/.env.production

      # ── Arquivos de deploy ──
      - name: Prepare deploy directory
        run: |
          mkdir -p /var/www/indies/nginx /var/www/indies/certs
          cp "$GITHUB_WORKSPACE/deploy/nginx/"* /var/www/indies/nginx/
          cp "$GITHUB_WORKSPACE/deploy/compose.yaml" /var/www/indies/

      # ── Certificados SSL do Postgres ──
      # Usa um container temporário para escrever no volume Docker.
      # O github-runner não tem acesso a /var/lib/docker/volumes/ no host,
      # mas o container roda como root e escreve via bind mount.
      - name: Ensure Postgres SSL certificates
        run: |
          docker volume inspect indies_postgres-certs >/dev/null 2>&1 || docker volume create indies_postgres-certs
          docker run --rm -e HOME -e PATH -v indies_postgres-certs:/certs alpine:latest sh -c '
            apk add --no-cache openssl >/dev/null 2>&1

            if [ ! -f /certs/root.key ]; then
              echo "🧾 Generating root CA"
              openssl genrsa -out /certs/root.key 4096
              openssl req -x509 -new -nodes \
                -key /certs/root.key \
                -sha256 -days 3650 \
                -subj "/CN=Postgres Root CA" \
                -out /certs/root.crt
            fi

            if [ ! -f /certs/server.key ]; then
              echo "🔑 Generating server key"
              openssl genrsa -out /certs/server.key 4096
            fi

            if [ ! -f /certs/server.csr ]; then
              echo "📄 Generating server CSR"
              openssl req -new \
                -key /certs/server.key \
                -subj "/CN=postgres" \
                -out /certs/server.csr
            fi

            if [ ! -f /certs/server.crt ]; then
              echo "📜 Signing server certificate"
              openssl x509 -req \
                -in /certs/server.csr \
                -CA /certs/root.crt \
                -CAkey /certs/root.key \
                -CAcreateserial \
                -out /certs/server.crt \
                -days 3650 -sha256
            fi

            echo "🔒 Fixing permissions"
            chown -R 70:70 /certs
            chmod 755 /certs
            chmod 600 /certs/server.key
            chmod 644 /certs/server.crt /certs/root.crt

            echo "✅ Postgres SSL certificates ready"
          '

      # ── Build & deploy ──
      - name: Build and deploy app
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "🐳 Building Docker image..."
          docker build -t indies-app:latest .

          cd /var/www/indies

          echo "🔍 Checking .env.production"
          test -f .env.production || { echo "❌ .env.production NOT FOUND"; exit 1; }

          echo "🔍 Checking nginx config files"
          test -f nginx/indies.http.conf || { echo "❌ indies.http.conf NOT FOUND"; exit 1; }
          test -f nginx/indies.https.conf || { echo "❌ indies.https.conf NOT FOUND"; exit 1; }

          echo "🚀 Starting containers..."
          docker compose -f compose.yaml up -d --no-deps --force-recreate indies-app

      # ── Reload nginx ──
      - name: Reload nginx
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^nginx$'; then
            echo "⏳ Waiting for nginx to be running..."

            for i in $(seq 1 15); do
              STATUS=$(docker inspect -f '{{.State.Status}}' nginx 2>/dev/null || true)

              if [ "$STATUS" = "running" ]; then
                docker exec nginx nginx -s reload
                echo "✅ nginx reloaded"
                exit 0
              fi

              echo "⏳ nginx status: $STATUS (retry $i/15)"
              sleep 2
            done

            echo "⚠️ nginx did not reach running state"
          else
            echo "ℹ️ nginx container not found, skipping reload"
          fi
