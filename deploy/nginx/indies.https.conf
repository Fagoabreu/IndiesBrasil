server {
  listen 443 ssl;
  http2 on;
  server_name jogos.social.br;
  ssl_certificate     /etc/letsencrypt/live/jogos.social.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jogos.social.br/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  # ── Security headers ──
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.instagram.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://static-cdn.jtvnw.net https://i.ytimg.com https://img.youtube.com https://cdn.akamai.steamstatic.com https://cdn.cloudflare.steamstatic.com https://shared.fastly.steamstatic.com; font-src 'self'; connect-src 'self' https://api.cloudinary.com https://viacep.com.br https://www.instagram.com; frame-src https://www.youtube.com https://player.twitch.tv https://store.steampowered.com https://itch.io https://maps.google.com https://www.google.com https://www.instagram.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  client_max_body_size 10m;

  location / {
    proxy_pass http://indies-app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #proxy_set_header Cookie $http_cookie;
  }
}

# `www.jogos.social.br` é o MESMO site, não um host diferente: sem este bloco o
# nome não casava com `server_name` nenhum e caía no bloco padrão do nginx, que
# servia o site inteiro com **200** — duas cópias do mesmo conteúdo em dois
# endereços. O `rel=canonical` já apontava para o domínio sem `www`, mas isso é
# uma sugestão que o buscador pode ignorar, e o resultado é o que se vê na
# prática: as duas cópias dividindo os sinais (links, visitas, histórico) da
# mesma página. O 301 é a resposta inequívoca, e o certificado cobre `www` (SAN),
# então a conexão é estabelecida antes de o redirect acontecer.
#
# O bloco não repete os headers de segurança do domínio canônico: uma resposta
# que só devolve um `Location` não serve conteúdo para proteger.
server {
  listen 443 ssl;
  http2 on;
  server_name www.jogos.social.br;

  ssl_certificate     /etc/letsencrypt/live/jogos.social.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jogos.social.br/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://jogos.social.br$request_uri;
}
