server {
  listen 443 ssl;
  http2 on;
  server_name jogos.social.br;

  ssl_certificate     /etc/letsencrypt/live/jogos.social.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jogos.social.br/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  # ── Security headers ──
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://static-cdn.jtvnw.net https://i.ytimg.com https://img.youtube.com; font-src 'self'; connect-src 'self' https://api.cloudinary.com; frame-src https://www.youtube.com https://player.twitch.tv; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 10m;

  location / {
    proxy_pass http://indies-app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #proxy_set_header Cookie $http_cookie;
  }
}
