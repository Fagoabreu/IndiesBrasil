# LiveKit (SFU de reuniões por vídeo) — proxy HTTP/WebSocket.
#
# A URL pública é wss://livekit.jogos.social.br (definida em LIVEKIT_URL,
# var do environment production no GitHub). O navegador (livekit-client) e o
# RoomServiceClient do app (que converte https:// e chama twirp) passam por aqui.
#
# ATENÇÃO: o certificado usado é o MESMO do site (cert-name = domínio primário).
# Para o browser aceitar o wss é preciso que o CERTBOT_DOMAIN (CSV) inclua este
# subdomínio — ex.: CERTBOT_DOMAIN=jogos.social.br,livekit.jogos.social.br — e
# que exista registro DNS livekit.jogos.social.br apontando para o servidor.

server {
  listen 80;
  server_name livekit.jogos.social.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name livekit.jogos.social.br;

  ssl_certificate     /etc/letsencrypt/live/jogos.social.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jogos.social.br/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  # WebSocket (signaling) + HTTP/Twirp (RoomServiceClient) do LiveKit.
  # O próprio LiveKit faz upgrade para wss no mesmo fluxo HTTP.
  location / {
    proxy_pass http://livekit:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
