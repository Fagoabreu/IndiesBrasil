# meet.jogos.social.br — Webconferência Galene (atrás do nginx).
#
# O Galene roda com network_mode: host e escuta HTTP puro em :8000
# (-http :8000 -insecure). O TLS é terminado aqui; o nginx alcança o
# container via host-gateway (extra_hosts no compose).
#
# O certificado é o MESMO de jogos.social.br: o certbot roda com
# --expand --cert-name jogos.social.br e os SANs incluem meet.
server {
  listen 443 ssl;
  http2 on;
  server_name meet.jogos.social.br;

  ssl_certificate     /etc/letsencrypt/live/jogos.social.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jogos.social.br/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  # ── Security headers ──
  # CSP ajustada para o cliente estático do Galene (mesma origem + WebSocket).
  # A mídia WebRTC é UDP direto (SFU), não passa por aqui.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss: ws:; media-src 'self' blob: mediastream:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;

  # Anexos e uploads de captions são pequenos; folga para o cliente Galene.
  client_max_body_size 20m;

  # WebSocket (galene usa /ws) + proxy do cliente estático.
  location / {
    proxy_pass http://host.docker.internal:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
