server {
  listen 80;
  # meet.jogos.social.br compartilha este bloco: responde o acme-challenge
  # (SAN do mesmo certificado) e redireciona para HTTPS.
  #
  # `www` entra aqui pelo mesmo motivo do acme-challenge — o certificado o cobre
  # (SAN) — e porque sem ele o domínio cairia no bloco padrão do nginx e serviria
  # o site por HTTP, sem redirect. Ver o bloco de `www` no `indies.https.conf`,
  # que é quem manda de fato para o domínio canônico.
  server_name jogos.social.br meet.jogos.social.br www.jogos.social.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
