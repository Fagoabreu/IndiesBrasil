server {
  listen 80;
  # meet.jogos.social.br compartilha este bloco: responde o acme-challenge
  # (SAN do mesmo certificado) e redireciona para HTTPS.
  server_name jogos.social.br meet.jogos.social.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
