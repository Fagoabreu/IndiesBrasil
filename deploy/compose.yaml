services:
  postgres:
    user: "70:70"
    image: postgres:17.2-alpine3.20
    container_name: postgres
    restart: always
    env_file:
      - .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-certs:/etc/postgres/certs
    command:
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/postgres/certs/server.crt"
      - "-c"
      - "ssl_key_file=/etc/postgres/certs/server.key"
      - "-c"
      - "ssl_ca_file=/etc/postgres/certs/root.crt"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  indies-app:
    image: indies-app:latest
    container_name: indies-app
    restart: always
    env_file:
      - .env.production
    volumes:
      - uploads-data:/app/public/uploads
      - postgres-certs:/etc/ssl/postgres
      # Volume compartilhado com o Galene (uid 1001 nos dois containers):
      # o app provisiona groups/<room>.json e o Galene faz hot-reload.
      - galene-groups:/app/groups
    depends_on:
      - postgres
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  galene:
    image: indies-galene:galene-1.1
    container_name: galene
    restart: always
    # Host networking é OBRIGATÓRIO: o TURN embutido (-turn :1194) enumera
    # endereços IPv4 públicos do host (publicAddresses) e morre em rede bridge
    # com "no public addresses"; a mídia SFU também é relayada pelo servidor.
    network_mode: host
    # Sem TLS aqui: o nginx termina SSL em meet.jogos.social.br e faz proxy
    # para http://host.docker.internal:8000 (websocket com Upgrade).
    command:
      - "-http"
      - ":8000"
      - "-insecure"
      - "-turn"
      - ":1194"
      - "-udp-range"
      - "40000-40100"
    volumes:
      - galene-data:/app/data
      - galene-groups:/app/groups

  nginx:
    image: nginx:1.29
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # Permite o vhost meet.jogos.social.br alcançar o Galene (network_mode:
      # host) via gateway do Docker host.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - nginx_secrets:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - public
      - private

  certbot:
    image: certbot/certbot
    container_name: certbot
    env_file:
      - .env.production
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - public

networks:
  private:
  public:

volumes:
  postgres-data:
  postgres-certs:
  uploads-data:
  nginx_secrets:
  certbot-webroot:
  galene-data:
  galene-groups:
