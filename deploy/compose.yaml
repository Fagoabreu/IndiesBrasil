services:
  postgres:
    user: "70:70"
    image: postgres:17.2-alpine3.20
    container_name: postgres
    restart: always
    env_file:
      - .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-certs:/etc/postgres/certs
    command:
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/postgres/certs/server.crt"
      - "-c"
      - "ssl_key_file=/etc/postgres/certs/server.key"
      - "-c"
      - "ssl_ca_file=/etc/postgres/certs/root.crt"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  indies-app:
    image: indies-app:latest
    container_name: indies-app
    restart: always
    env_file:
      - .env.production
    volumes:
      - uploads-data:/app/public/uploads
      - postgres-certs:/etc/ssl/postgres
    depends_on:
      - postgres
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.29
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - nginx_secrets:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - public
      - private

  livekit:
    # SFU de reuniões por vídeo. Config gerada do .env.production
    # ($$ escapa do Compose; o shell do container expande as variáveis).
    # A imagem livekit/livekit-server tem ENTRYPOINT [/livekit-server], então
    # o command viraria argumento do binário (erro "flag -c not defined").
    # Sobrescrevemos o entrypoint para o shell gerar a config e exec do binário
    # em /livekit-server (fora do PATH).
    # Em produção, aponte LIVEKIT_URL para um host com TLS (ex.:
    # wss://livekit.jogos.social.br) e faça o proxy do domínio no nginx.
    image: livekit/livekit-server
    container_name: livekit
    restart: always
    env_file:
      - .env.production
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-60000:50000-60000/udp" # ICE/DTLS-SRTP (mídia)
    networks:
      - private
    entrypoint:
      - "/bin/sh"
      - "-c"
    command:
      - |
        cat > /etc/livekit.yaml <<EOF
        port: 7880
        rtc:
          tcp_port: 7881
          # IP público do host + portas publicadas: anunciar o IP externo
          # (não o IP interno 172.x do container) para os clientes WebRTC.
          use_external_ip: true
          stun_servers:
            - stun:stun.l.google.com:19302
          port_range_start: 50000
          port_range_end: 60000
        keys:
          $${LIVEKIT_API_KEY}: "$${LIVEKIT_API_SECRET}"
        room:
          empty_timeout: 600
          max_participants: 50
        EOF
        exec /livekit-server --config /etc/livekit.yaml

  certbot:
    image: certbot/certbot
    container_name: certbot
    env_file:
      - .env.production
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - public

networks:
  private:
  public:

volumes:
  postgres-data:
  postgres-certs:
  uploads-data:
  nginx_secrets:
  certbot-webroot:
