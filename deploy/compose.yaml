services:
  postgres:
    user: "70:70"
    image: postgres:17.2-alpine3.20
    container_name: postgres
    restart: always
    env_file:
      - .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-certs:/etc/postgres/certs
    command:
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/postgres/certs/server.crt"
      - "-c"
      - "ssl_key_file=/etc/postgres/certs/server.key"
      - "-c"
      - "ssl_ca_file=/etc/postgres/certs/root.crt"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  indies-app:
    image: indies-app:latest
    container_name: indies-app
    restart: always
    env_file:
      - .env.production
    volumes:
      - uploads-data:/app/public/uploads
      - postgres-certs:/etc/ssl/postgres
    depends_on:
      - postgres
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.29
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # IP do host visto da rede docker (Docker >= 20.10, "host-gateway").
      # O livekit roda em network_mode: host (fora da rede bridge do compose),
      # então "livekit:7880" não resolve no DNS interno — o livekit.conf usa
      # host.docker.internal:7880 para alcançar o SFU no próprio host.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - nginx_secrets:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - public
      - private

  livekit:
    # SFU de reuniões por vídeo. Config gerada do .env.production
    # ($$ escapa do Compose; o shell do container expande as variáveis).
    # A imagem livekit/livekit-server tem ENTRYPOINT [/livekit-server], então
    # o command viraria argumento do binário (erro "flag -c not defined").
    # Sobrescrevemos o entrypoint para o shell gerar a config e exec do binário
    # em /livekit-server (fora do PATH).
    #
    # network_mode: host — modo recomendado pelo LiveKit para SFU. Antes o
    # compose publicava as portas 7880/7881/50000-60000 (10001 UDP) via
    # docker-proxy no bridge; isso travava o `docker compose up` e containers de
    # crash loop seguravam as portas entre deploys. Em host network o livekit
    # faz bind direto em 0.0.0.0 no host e o nginx o alcança via
    # host.docker.internal:7880 (extra_hosts host-gateway no serviço nginx;
    # ver deploy/nginx/livekit.conf).
    image: livekit/livekit-server
    container_name: livekit
    restart: always
    network_mode: host
    env_file:
      - .env.production
    entrypoint:
      - "/bin/sh"
      - "-c"
    command:
      - |
        cat > /etc/livekit.yaml <<EOF
        port: 7880
        rtc:
          tcp_port: 7881
          # Bind direto no host (network_mode: host); o IP público é descoberto
          # via STUN e anunciado aos clientes WebRTC.
          use_external_ip: true
          stun_servers:
            # Formato host:port sem scheme (v1.13.6 rejeita "stun:" prefixado
            # com "too many colons in address" e o container entra em crash loop).
            - stun.l.google.com:19302
          port_range_start: 50000
          port_range_end: 60000
        keys:
          $${LIVEKIT_API_KEY}: "$${LIVEKIT_API_SECRET}"
        room:
          empty_timeout: 600
          max_participants: 50
        EOF
        exec /livekit-server --config /etc/livekit.yaml

  certbot:
    image: certbot/certbot
    container_name: certbot
    env_file:
      - .env.production
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - public

networks:
  private:
  public:

volumes:
  postgres-data:
  postgres-certs:
  uploads-data:
  nginx_secrets:
  certbot-webroot:
